<div class="container-fluid vh-100" *ngIf="!loading">
    <div class="row vh-100 d-flex justify-content-center align-items-center">
        <div class="col-10">
            <nb-card class="containercard">
                <div class="row" class="picture1">
                    <div class="col-md-8">
                        <img mat-card-image src="./assets/images/brightupbo.png" alt="card1" class="img-fluid">
                    </div>
                    <div class="col-md-4">
                        <div class="row">
                            <div class="col-12">
                                <h3 class="mb-4 mt-2 logtext">Change Password</h3>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                                    <div class="row">
                                        <div class="col-md-12">
                                            <label for="newpass">New Password</label>
                                            <input formControlName="newpass" type="password" class="form-control"
                                                id="newpass" placeholder="New Password"
                                                [ngClass]="{ 'is-invalid': form.get('newpass')?.invalid && form.get('newpass')?.touched }">
                                            <span class="errormsg"
                                                *ngIf="form.get('newpass')?.errors?.['required']&&form.get('newpass')?.touched">
                                                This field is required.
                                            </span>
                                              <span class="errormsg"
                                                *ngIf="form.get('newpass')?.errors?.['minlength'] && form.get('newpass')?.touched">
                                                 Password must be at least 4 characters long
                                            </span>
                                            <span class="errormsg" *ngIf="errorMessage">
                                                {{ errorMessage }}
                                            </span>
                                            <!-- <span class="errormsg" *ngIf="form.get('email')?.errors?.['email']&&form.get('email')?.touched">
                                                        Invaild email
                                                    </span>   -->
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-md-12">
                                            <label for="password">Confirm Password</label>
                                            <input formControlName="compass" type="password" class="form-control"
                                                id="compass" placeholder="Confirm password"
                                                [ngClass]="{ 'is-invalid': form.get('compass')?.invalid && form.get('compass')?.touched }">
                                            <span class="errormsg"
                                                *ngIf="form.get('compass')?.errors?.['required']&&form.get('compass')?.touched">
                                                This field is required
                                            </span>
                                              <span class="errormsg"
                                                *ngIf="form.get('compass')?.errors?.['minlength'] && form.get('compass')?.touched">
                                                Password must be at least 4 characters long
                                            </span>
                                            <span class="errormsg" *ngIf="errorMessage">
                                                {{ errorMessage }}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="buttons">
                                        <button type="submit" class="btn btn-primary mt-4 w-100">Change
                                            Password</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-12">
                                <div class="sign-in-or-up" aria-label="Sign in or sign up">
                                    <a class="text-link" routerLink="/auth/login">Back to Log In</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nb-card>
        </div>
    </div>
</div>

<div class="loader" *ngIf="loading">
    <img src="./assets/images/loading.gif" alt="loading" class="loader-img">
</div>
