<div class="container-fluid" *ngIf="!loading">
  <nb-card>
    <nb-card-header>
      <div class="header-container">
        <div class="header-title">Security Question</div>
        <div class="header-actions">
          <input #search class="search" type="text" placeholder="Search..." (input)="onSearch(search.value)">
          <button (click)="openWindowForm(addModal)" nbButton>Add New</button>
        </div>
      </div>
    </nb-card-header>

    <nb-card-body>
      <angular2-smart-table [settings]="settings" [source]="source" (edit)="edit($event, editModal)">
      </angular2-smart-table>

      <ng-template #addModal>
        <form [formGroup]="addForm" *ngIf="!modelLoading" (ngSubmit)="create()">
          <div class="form-group">
            <label for="code">Code</label>
            <input type="text" formControlName="code" id="code" class="contact-code form-control"
              placeholder="Enter Code"
              [ngClass]="{'is-invalid': addForm.get('code').touched && addForm.get('code').invalid}">
            <div class="errormsg" *ngIf="addForm.get('code')?.errors?.['required']&&addForm.get('code')?.touched">
              Code is required.
            </div>
            <div *ngIf="addForm.touched" class="errormsg">
              <div *ngIf="errorMessage">
                {{ errorMessage }}
              </div>
            </div>
          </div>


          <div class="form-group">
            <label for="question">Question</label>
            <input type="text" formControlName="question" id="question" class="contact-question form-control"
              placeholder="Enter Question"
              [ngClass]="{'is-invalid': addForm.get('question').touched && addForm.get('question').invalid}">
            <div class="errormsg" *ngIf="addForm.get('question')?.errors?.['required']&&addForm.get('question')?.touched">
              Question is required.
            </div>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select formControlName="status" name="status" id="status" class="contact-name form-control"
              [ngClass]="{'is-invalid': addForm.get('status').touched && addForm.get('status').invalid}">
              <option value="null" selected disabled>- Select -</option>
              <option value="A">Active</option>
              <option value="I">Inactive</option>
            </select>
            <div class="errormsg" *ngIf="addForm.get('status')?.errors?.['required']&&addForm.get('status')?.touched">
              Status is required.
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-outline-success">Submit</button>
            <button type="button" class="btn btn-outline-warning" (click)="dialogRef.close()">Cancel</button>
          </div>
        </form>
        <div class="loader" *ngIf="modelLoading">
          <img src="./assets/images/loading.gif" alt="modelLoading" class="loader-img">
        </div>
      </ng-template>


      
      <ng-template #editModal>
        <form [formGroup]="editForm" (ngSubmit)="update()" *ngIf="!modelLoading">
          <div class="form-group">
            <label for="code">Code</label>
            <input type="text" formControlName="code" id="code" class="contact-code form-control"
              placeholder="Enter Code"
              [ngClass]="{'is-invalid': editForm.get('code').touched && editForm.get('code').invalid}">
          </div>

          <div class="form-group">
            <label for="question">Question</label>
            <input type="text" formControlName="question" id="question" class="contact-question form-control"
              (input)="onFieldChange()" placeholder="Enter Question"
              [ngClass]="{'is-invalid': editForm.get('question').touched && editForm.get('question').invalid}">
            <div class="errormsg" *ngIf="editForm.get('question')?.errors?.['required']&&editForm.get('question')?.touched">
              Question is required.
            </div>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select formControlName="status" name="status" id="status" class="contact-name form-control"
              (change)="onFieldChange()"
              [ngClass]="{'is-invalid': editForm.get('status').touched && editForm.get('status').invalid}">
              <option value="A">Active</option>
              <option value="I">Inactive</option>
            </select>
            <div class="errormsg" *ngIf="editForm.get('status')?.errors?.['required']&&editForm.get('status')?.touched">
              Status is required.
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" [disabled]="!isChanged" class="btn btn-outline-success">Update</button>
            <button type="button" class="btn btn-outline-warning" (click)="dialogRef.close()">Cancel</button>
          </div>
        </form>
        <div *ngIf="modelLoading" class="imgparent">
          <img src="./assets/images/loading.gif" alt="modelLoading" class="loader-img">
        </div>
      </ng-template>
    </nb-card-body>
  </nb-card>
</div>

<div class="loader" *ngIf="loading">
  <img src="./assets/images/loading.gif" alt="loading" class="loader-img">
</div>
