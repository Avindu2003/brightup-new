<div class="container-fluid" *ngIf="!loading">
  <nb-card>
    <nb-card-header>
      <div class="header-container">
        <div class="header-title">Exam Category</div>
        <div class="header-actions">
          <input #search class="search" type="text" placeholder="Search..." (input)="onSearch(search.value)" >
          <button (click)="openWindowForm(addModal)" nbButton *ngIf="!loading">Add New</button>
        </div>
      </div>
    </nb-card-header>

    <nb-card-body>
      <angular2-smart-table [settings]="settings" [source]="source" (deleteConfirm)="onDeleteConfirm($event)" (edit)="edit($event, editModal)" *ngIf="!loading">
      </angular2-smart-table>
      
      <ng-template #addModal>
        <form [formGroup]="addForm"  (ngSubmit)="create()" *ngIf="!modelLoading">
          <div class="form-group">
            <label for="code">Code</label>
            <input type="text" formControlName="code" id="code" class="contact-code form-control" placeholder="Enter Code" [ngClass]="{'is-invalid': (addForm.get('code').touched && addForm.get('code').invalid) || examExistsError }">
            <div *ngIf="addForm.touched && !(addForm.get('code').valid)" class="invalid-feedback">
              <div *ngIf="addForm.get('code').value == '' || addForm.get('code').value == null">Code is required</div>
            </div>
            <div *ngIf="examExistsError" class="invalid-feedback">
              Exam Category already exists!
            </div>
          </div>

          <div class="form-group">
            <label for="exam">Exam Category</label>
            <input type="text" formControlName="exam" id="exam" class="contact-exam form-control" placeholder="Enter Exam Category" [ngClass]="{'is-invalid': addForm.get('exam').touched && addForm.get('exam').invalid }">
            <div *ngIf="addForm.touched && !(addForm.get('exam').valid)" class="invalid-feedback">
              <div *ngIf="addForm.get('exam').value == '' || addForm.get('exam').value == null">Exam Category is required</div>
            </div>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select formControlName="status" name="status" id="status" class="contact-name form-control"
            [ngClass]="{'is-invalid': addForm.get('status').touched && addForm.get('status').invalid}">
              <option value="null" selected="selected" disabled="disabled">- Select -</option>
              <option value="A">Active</option>
              <option value="I">Inactive</option>
            </select>
            <div class="invalid-feedback">
              <div *ngIf="addForm.get('status').value == '' || addForm.get('status').value == null">Status is required</div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-outline-success">Submit</button>
            <button type="button" class="btn btn-outline-warning"  (click)="dialogRef.close()">Cancel</button>
          </div>
        </form>

        <div class="loader" *ngIf="modelLoading">
            <img src="./assets/images/loading.gif" alt="loading" class="loader-img">
        </div>
      </ng-template>
      <ng-template #editModal>

        <form [formGroup]="editForm"  (ngSubmit)="update()" *ngIf="!modelLoading">
          <div class="form-group">
            <label for="code">Code</label>
            <input type="text"  formControlName="code" id="code" class="contact-code form-control" placeholder="Enter Code" [ngClass]="{'is-invalid': editForm.get('code').touched && editForm.get('code').invalid}">
            <div *ngIf="editForm.touched && !(editForm.get('code').valid)" class="invalid-feedback">
              <div *ngIf="editForm.get('code').value == '' || editForm.get('code').value == null">Code is required</div>
            </div>
          </div>

          <div class="form-group">
            <label for="exam">Exam Category</label>
            <input type="text" formControlName="exam" id="exam" class="contact-exam form-control"  (input)="onFieldChange()" placeholder="Enter Exam" [ngClass]="{'is-invalid': editForm.get('exam').touched && editForm.get('exam').invalid}">
            <div *ngIf="editForm.touched && !(editForm.get('exam').valid)" class="invalid-feedback">
              <div *ngIf="editForm.get('exam').value == '' || editForm.get('exam').value == null">Exam is required</div>
            </div>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select formControlName="status" name="status" id="status" class="contact-name form-control"  (change)="onFieldChange()"
            [ngClass]="{'is-invalid': editForm.get('status').touched && editForm.get('status').invalid}">
              <option value="disabled" selected="selected" disabled="disabled">- Select -</option>
              <option value="A">Active</option>
              <option value="I">Inactive</option>
            </select>
            <div class="invalid-feedback">
              <div *ngIf="editForm.get('status').value == '' || editForm.get('status').value == null">Status is required</div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" [disabled]="!isChanged" class="btn btn-outline-success">Update</button>
            <button type="button" class="btn btn-outline-warning"  (click)="dialogRef.close()">Cancel</button>
          </div>
        </form>
         <div class="loader" *ngIf="modelLoading">
            <img src="./assets/images/loading.gif"  alt="modelLoading" class="loader-img">
        </div>
      </ng-template>
    </nb-card-body>
  </nb-card>
</div>
<div class="loader" *ngIf="loading">
    <img src="./assets/images/loading.gif" alt="loading" class="loader-img">
</div>
